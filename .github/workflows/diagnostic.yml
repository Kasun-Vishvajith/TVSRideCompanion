name: Diagnostic APK
on:
  push:
    branches: [master, codex/tvs-diagnostic-bench]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build diagnostic
        run: ./gradlew :app:testDebugUnitTest :diagnostic:assembleDebug --no-daemon --max-workers=2 --no-parallel
      - uses: actions/upload-artifact@v4
        with:
          name: tvs-diagnostic-debug
          path: diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
          if-no-files-found: error
