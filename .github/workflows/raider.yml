name: Raider 125
on:
  push:
    paths: ['raider/**', '.github/workflows/raider.yml', 'gradle/wrapper/**', 'gradlew']
  pull_request:
    paths: ['raider/**', '.github/workflows/raider.yml', 'gradle/wrapper/**', 'gradlew']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Raider signing key
        env:
          KEY_B64: ${{ secrets.RAIDER_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RAIDER_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.RAIDER_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RAIDER_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ]; then
            echo '::warning::Signing secret absent; APK uses an ephemeral debug key.'
            exit 0
          fi
          printf '%s' "$KEY_B64" | base64 -d > raider-release.jks
          {
            printf 'storeFile=raider-release.jks\n'
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"
          } > key.properties
      - name: Test, lint and build both APKs
        run: ./gradlew -p raider :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --max-workers=2 --no-parallel --stacktrace
      - name: Assert merged APK permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          for APK in raider/app/build/outputs/apk/{debug/app-debug,release/app-release}.apk; do
            "$AAPT2" dump permissions "$APK" > /tmp/raider-permissions.txt
            if grep -q 'android.permission.INTERNET' /tmp/raider-permissions.txt; then
              echo '::error::Offline app must never request INTERNET'; exit 1
            fi
            for permission in BLUETOOTH_SCAN BLUETOOTH_CONNECT POST_NOTIFICATIONS FOREGROUND_SERVICE_CONNECTED_DEVICE; do
              grep -q "android.permission.$permission" /tmp/raider-permissions.txt
            done
            if grep -Eq 'android.permission.(READ_CONTACTS|READ_CALL_LOG|CALL_PHONE|ACCESS_BACKGROUND_LOCATION)' /tmp/raider-permissions.txt; then
              echo '::error::Unexpected sensitive permission'; exit 1
            fi
          done
      - name: Verify permanent Raider signer
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f key.properties ]; then
            echo 'No private key available on this run; skipping owner signer assertion.'
            exit 0
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for APK in raider/app/build/outputs/apk/{debug/app-debug,release/app-release}.apk; do
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/raider-certificate.txt
            grep -qi 'certificate SHA-256 digest: d7c06d3c58594b17b1fbe7d81ac1fdbe75398a104818323b2755026d38edb5d6$' /tmp/raider-certificate.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: raider-debug
          path: raider/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raider-optimized
          path: raider/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raider-checks
          path: |
            raider/app/build/reports/tests/
            raider/app/build/reports/lint-results-release.html
